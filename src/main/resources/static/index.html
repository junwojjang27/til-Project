<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIL 메모장</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1rem;
      background: #f8f9fa;
      color: #212529;
    }

    h1 { margin: 0 0 1.5rem; font-size: 1.5rem; }

    section { background: #fff; border-radius: 8px; padding: 1.25rem; margin-bottom: 1.5rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); }

    label { display: block; font-size: .875rem; font-weight: 600; margin-bottom: .25rem; }

    input, textarea {
      width: 100%;
      border: 1px solid #ced4da;
      border-radius: 4px;
      padding: .5rem .75rem;
      font-size: 1rem;
      font-family: inherit;
      margin-bottom: .75rem;
    }

    textarea { resize: vertical; min-height: 100px; }

    button {
      cursor: pointer;
      border: none;
      border-radius: 4px;
      padding: .5rem 1rem;
      font-size: .875rem;
      font-family: inherit;
    }

    #submitBtn {
      background: #0d6efd;
      color: #fff;
    }

    #submitBtn:hover { background: #0b5ed7; }

    #errorMsg {
      display: none;
      margin-top: .75rem;
      color: #dc3545;
      font-size: .875rem;
    }

    #list { list-style: none; margin: 0; padding: 0; }

    .til-item {
      border-bottom: 1px solid #e9ecef;
      padding: .75rem 0;
    }

    .til-item:last-child { border-bottom: none; }

    .til-header {
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .til-title {
      flex: 1;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      background: none;
      border: none;
      padding: 0;
      text-align: left;
      color: #212529;
    }

    .til-title:hover { color: #0d6efd; }

    .til-meta {
      font-size: .8rem;
      color: #6c757d;
      white-space: nowrap;
    }

    .til-tag {
      font-size: .75rem;
      background: #e7f1ff;
      color: #0d6efd;
      border-radius: 12px;
      padding: .1rem .5rem;
    }

    .delete-btn {
      background: #fff;
      color: #dc3545;
      border: 1px solid #dc3545;
      padding: .25rem .6rem;
      font-size: .75rem;
      border-radius: 4px;
    }

    .delete-btn:hover { background: #dc3545; color: #fff; }

    .til-content {
      display: none;
      margin-top: .5rem;
      font-size: .9375rem;
      line-height: 1.6;
      white-space: pre-wrap;
      color: #343a40;
    }

    .til-content.open { display: block; }

    #emptyMsg { color: #6c757d; font-size: .9rem; padding: .5rem 0; }
  </style>
</head>
<body>
  <h1>TIL 메모장</h1>

  <section>
    <form id="tilForm">
      <label for="title">제목 <span style="color:#dc3545">*</span></label>
      <input id="title" type="text" maxlength="100" placeholder="오늘 배운 것 (100자 이내)" required>

      <label for="content">내용 <span style="color:#dc3545">*</span></label>
      <textarea id="content" maxlength="2000" placeholder="자세한 내용 (2000자 이내)" required></textarea>

      <label for="tag">태그</label>
      <input id="tag" type="text" maxlength="50" placeholder="예: AI  (선택)">

      <button type="submit" id="submitBtn">저장</button>
      <p id="errorMsg"></p>
    </form>
  </section>

  <section>
    <ul id="list"></ul>
    <p id="emptyMsg" style="display:none">아직 기록이 없습니다.</p>
  </section>

  <script>
    const form = document.getElementById('tilForm');
    const listEl = document.getElementById('list');
    const emptyMsg = document.getElementById('emptyMsg');
    const errorMsg = document.getElementById('errorMsg');

    async function loadList() {
      const res = await fetch('/api/tils');
      if (!res.ok) {
        showError('목록을 불러오지 못했습니다.');
        return;
      }
      const data = await res.json();
      listEl.replaceChildren();
      if (data.length === 0) {
        emptyMsg.style.display = 'block';
        return;
      }
      emptyMsg.style.display = 'none';
      data.forEach(item => listEl.appendChild(createItem(item)));
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
    }

    function createItem(item) {
      const li = document.createElement('li');
      li.className = 'til-item';

      const header = document.createElement('div');
      header.className = 'til-header';

      const titleBtn = document.createElement('button');
      titleBtn.className = 'til-title';
      titleBtn.type = 'button';
      titleBtn.textContent = item.title;

      const contentDiv = document.createElement('div');
      contentDiv.className = 'til-content';

      titleBtn.addEventListener('click', () => {
        if (contentDiv.classList.contains('open')) {
          contentDiv.classList.remove('open');
          return;
        }
        loadContent(item.id, contentDiv);
      });

      const metaSpan = document.createElement('span');
      metaSpan.className = 'til-meta';
      metaSpan.textContent = formatDate(item.createdAt);

      header.appendChild(titleBtn);

      if (item.tag) {
        const tagSpan = document.createElement('span');
        tagSpan.className = 'til-tag';
        tagSpan.textContent = item.tag;
        header.appendChild(tagSpan);
      }

      header.appendChild(metaSpan);

      const delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.type = 'button';
      delBtn.textContent = '삭제';
      delBtn.addEventListener('click', () => deleteTil(item.id));
      header.appendChild(delBtn);

      li.appendChild(header);
      li.appendChild(contentDiv);
      return li;
    }

    async function loadContent(id, contentDiv) {
      if (!contentDiv.dataset.loaded) {
        const res = await fetch(`/api/tils/${id}`);
        if (!res.ok) {
          const err = await res.json().catch(() => ({ message: '내용을 불러오지 못했습니다.' }));
          contentDiv.textContent = err.message;
          contentDiv.classList.add('open');
          return;
        }
        const data = await res.json();
        contentDiv.textContent = data.content;
        contentDiv.dataset.loaded = 'true';
      }
      contentDiv.classList.add('open');
    }

    async function deleteTil(id) {
      if (!confirm('정말 삭제하시겠습니까?')) return;
      const res = await fetch(`/api/tils/${id}`, { method: 'DELETE' });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ message: '삭제에 실패했습니다.' }));
        showError(err.message);
        return;
      }
      loadList();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';

      const body = {
        title: document.getElementById('title').value,
        content: document.getElementById('content').value,
        tag: document.getElementById('tag').value || null,
      };

      const res = await fetch('/api/tils', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      if (!res.ok) {
        const err = await res.json();
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
        return;
      }

      form.reset();
      loadList();
    });

    function formatDate(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
    }

    loadList();
  </script>
</body>
</html>
