# 기본 프로파일: 테스트 및 개발 기본값 (H2)
spring:
  datasource:
    url: jdbc:h2:mem:tildb;MODE=MySQL;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  sql:
    init:
      mode: always

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
